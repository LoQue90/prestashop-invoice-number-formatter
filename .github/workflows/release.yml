name: Check and release module

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP and formatter behavior
        run: |
          php -l invoicenumberformatter.php
          php -l src/Formatter.php
          php -l tests/formatter-smoke.php
          php tests/formatter-smoke.php
      - name: Check JavaScript
        run: node --check views/js/admin.js
      - name: Build installable ZIP
        run: python3 scripts/build-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-php-${{ matrix.php }}
          path: dist/invoicenumberformatter-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build-release.py
          test -f "dist/invoicenumberformatter-${RELEASE_TAG#v}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving existing assets.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "dist/invoicenumberformatter-${RELEASE_TAG#v}.zip" \
            --verify-tag --title "Invoice Number Formatter ${RELEASE_TAG#v}" \
            --generate-notes
